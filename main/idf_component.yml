# bibliotecas do ESP RainMaker (o esp-rainmaker precisa estar clonado em ~/Install/esp/esp-rainmaker)
dependencies:
  idf:
    version: ">=5.1.0"
  espressif/esp_rainmaker:
    version: ">=1.0"
    override_path: '../../esp-rainmaker/components/esp_rainmaker/'
  espressif/rmaker_app_network:
    version: "*"
    override_path: '../../esp-rainmaker/examples/common/rmaker_app_network/'
  espressif/rmaker_app_reset:
    version: "*"
    override_path: '../../esp-rainmaker/examples/common/rmaker_app_reset/'
  espressif/button:
    version: "^4.1.4"
